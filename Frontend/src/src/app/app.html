<div class="d-flex flex-column bg-dark text-white position-fixed side-nav">
  <h5 class="text-center p-3 mb-0">{{ title() }}</h5>
  <hr class="border-light mx-3" />

  <ul class="nav flex-column">
    <li class="nav-item">
      <button type="button" class="nav-link text-white text-start w-100 border-0 bg-transparent"
        (click)="employeeCollapsed = !employeeCollapsed" [attr.aria-expanded]="!employeeCollapsed"
        aria-controls="employeeSubMenu">
        Employee Management
      </button>
      <div id="employeeSubMenu" [ngbCollapse]="employeeCollapsed">
        <ul class="nav flex-column ms-3">
          <li class="nav-item">
            <a class="nav-link text-white" routerLink="/employee" routerLinkActive="active">
              Employees
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" routerLink="/department" routerLinkActive="active">
              Departments
            </a>
          </li>
        </ul>
      </div>
    </li>
  </ul>
</div>

<div class="main-content">
  <div class="card shadow-sm">
    <div class="card-body">
      <main role="main" class="pb-3">
        <router-outlet />
      </main>
    </div>
  </div>
</div>

<footer class="border-top footer text-muted main-footer">
  <div class="container">
    &copy; 2026 - Employee Management -
    <a routerLink="/privacy">Privacy</a>
  </div>
</footer>
